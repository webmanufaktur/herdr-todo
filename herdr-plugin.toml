id = "herdr-todo"
name = "Sidebar Todos"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Show open todo count next to each branch in the Herdr sidebar (from each project's TODOS.md or TODO.md), and open a todo tab listing todos. Live, per-workspace, via a background poller (launchd on macOS, systemd on Linux)."
platforms = ["linux", "macos"]

[[actions]]
id = "setup"
title = "Set up todo sidebar token + poller (backs up config)"
command = ["node", "herdr-todo.mjs", "setup"]

[[actions]]
id = "update"
title = "Update herdr-todo: pull sources, re-setup, restart poller, reinstall adapters, reload plugin"
command = ["node", "herdr-todo.mjs", "update"]

[[actions]]
id = "teardown"
title = "Stop poller + remove todo token (reversible)"
command = ["node", "herdr-todo.mjs", "teardown"]

[[actions]]
id = "status"
title = "Show poller state + per-workspace open todo counts"
command = ["node", "herdr-todo.mjs", "poller-status"]

[[actions]]
id = "open"
title = "Open a todo tab listing todos"
command = ["node", "herdr-todo.mjs", "open"]

[[actions]]
id = "adapters"
title = "List/install per-agent /todo adapters"
command = ["node", "herdr-todo.mjs", "adapters"]

# Plugin-owned live todo list in its own tab (label: todo). Managed by Herdr
# (not a shell pane), so `herdr agent start` correctly refuses it instead of
# racing a busy shell.
[[panes]]
id = "todos"
title = "todo"
placement = "tab"
command = ["node", "todo-watch.mjs", "4"]
