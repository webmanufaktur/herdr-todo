id = "herdr-todo"
name = "Sidebar Todos"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "Show open todo count next to each branch in the Herdr sidebar (from each project's TODOS.md or TODO.md), and when an agent is running in a workspace, open a dedicated TODO TAB per present todo file (TODO.md and TODOS.md each get their own tab). The tab stays open even when no open todos remain. Live, per-workspace, driven by Herdr's own agent registry (works for every agent kind), via a background poller (launchd on macOS, systemd on Linux)."
platforms = ["linux", "macos"]

[[actions]]
id = "setup"
title = "Set up todo sidebar token + poller (backs up config)"
command = ["node", "herdr-todo.mjs", "setup"]

[[actions]]
id = "update"
title = "Update herdr-todo: pull sources, re-setup, restart poller, reinstall adapters, reload plugin"
command = ["node", "herdr-todo.mjs", "update"]

[[actions]]
id = "teardown"
title = "Stop poller + remove todo token (reversible)"
command = ["node", "herdr-todo.mjs", "teardown"]

[[actions]]
id = "status"
title = "Show poller state + per-workspace open todo counts"
command = ["node", "herdr-todo.mjs", "poller-status"]

[[actions]]
id = "open"
title = "Open a todo tab per present todo file"
command = ["node", "herdr-todo.mjs", "open"]

[[actions]]
id = "adapters"
title = "List/install per-agent /todo adapters"
command = ["node", "herdr-todo.mjs", "adapters"]
